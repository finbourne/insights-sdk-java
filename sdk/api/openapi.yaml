  /api/metrics:
    get:
      description: |2-

        Returns request volumes, error rates and duration distributions for the domain's services, plus its identity
         population and activity counts. The domain is taken from the authenticated request, never from a parameter.

        <b>This endpoint is slow by design.</b> It runs several analytical queries in parallel and commonly takes
         upwards of thirty seconds when the underlying data is cold. The server abandons a data set that has not
         completed within its configured budget and reports it in `failed`, so a call returns rather than hanging
         indefinitely; allow comfortably more than that budget on the client, and do not call this on a
         user-interactive code path without showing progress.

        Partial success is normal and is still reported as a `200`. A data set that could not be retrieved is
         null in the response and named in `failed` with a reason; a data set excluded via
         include is null and named in `notIncluded`. Render a null data set as unavailable
         rather than as an absence of activity.
      operationId: GetMetrics
      parameters:
      - description: |-
          The data sets to return, by name. Omit to return all of them. Repeat the parameter to request several, for
          example `?include=RequestsPerMinute&include=IdentityMetrics`. Matched case-insensitively against the
          data set names, which are the `name` values on the response's data sets; duplicates are ignored.
        explode: true
        in: query
        name: include
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
        x-nullable: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
          description: The details of the input related failure
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidProblemDetails'
          description: Error response
      security:
      - oauth2: []
      summary: "[EARLY ACCESS] GetMetrics: Get the aggregated platform metrics for\
        \ the caller's domain."
      tags:
      - Metrics
      x-fbn-apistatus: EarlyAccess
      x-accepts: application/json
