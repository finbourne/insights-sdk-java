openapi: 3.0.4
info:
  contact:
    email: info@finbourne.com
    name: FINBOURNE Technology
    url: https://www.finbourne.com
  description: |
    Insights is LUSID's troubleshooting, monitoring and audit application. It enables you to quickly identify issues in failed requests, and offers a detailed view of your system's operations.

    ### Error Codes

    | Code|Name|Description |
    | ---|---|--- |
    | <a name="-1">-1</a>|Unknown error|An unexpected error was encountered on our side. |
    | <a name="144">144</a>|Duplicate In Parameter Set| |
    | <a name="150">150</a>|Elastic Search Error| |
    | <a name="151">151</a>|Invalid Parameter Value| |
    | <a name="181">181</a>|Data Filter Application Failure| |
    | <a name="182">182</a>|Search Failed| |
    | <a name="411">411</a>|Sort Field Does Not Exist| |
    | <a name="653">653</a>|Request File Not Found| |
    | <a name="678">678</a>|Log not found| |
    | <a name="689">689</a>|The supplied pagination token is invalid| |
    | <a name="692">692</a>|This endpoint does not support impersonation| |
    | <a name="871">871</a>|The specified impersonated user does not exist| |
    | <a name="939">939</a>|Blocked by a Network Zone| |
  termsOfService: https://www.finbourne.com/legal/terms-conditions
  title: FINBOURNE Insights API
  version: 0.0.943
  x-logo:
    url: https://www.lusid.com/app/assets/logo_white.png
    backgroundColor: '#415464'
  x-fbn-error-codes:
    "-1":
      title: Unknown error
      description: An unexpected error was encountered on our side.
    "144":
      title: Duplicate In Parameter Set
    "150":
      title: Elastic Search Error
    "151":
      title: Invalid Parameter Value
    "181":
      title: Data Filter Application Failure
    "182":
      title: Search Failed
    "411":
      title: Sort Field Does Not Exist
    "653":
      title: Request File Not Found
    "678":
      title: Log not found
    "689":
      title: The supplied pagination token is invalid
    "692":
      title: This endpoint does not support impersonation
    "871":
      title: The specified impersonated user does not exist
    "939":
      title: Blocked by a Network Zone
  x-fbn-description: "Insights is LUSID's troubleshooting, monitoring and audit application.\
    \ It enables you to quickly identify issues in failed requests, and offers a detailed\
    \ view of your system's operations."
servers:
- url: https://fbn-prd.lusid.com/insights
security:
- {}
tags:
- description: Methods to retrieve access evaluation logs.
  name: Access Evaluations
- description: Metadata about the test application
  name: Application Metadata
- description: Methods for interacting with Auditing
  name: Auditing
- description: Methods to retrieve Candela traces and trace events.
  name: Candela Traces
- description: Metadata describing the queryable fields of each log type.
  name: Log Metadata
- description: Aggregated platform request and identity metrics for a domain.
  name: Metrics
- description: Methods to retrieve logs and content of API requests.
  name: Requests
- description: Methods to retrieve logs and content of requests to vendors.
  name: Vendor Logs
paths:
  /api/access:
    get:
      operationId: ListAccessEvaluationLogs
      parameters:
      - description: Start date from which point to fetch logs.
        explode: true
        in: query
        name: startAt
        required: false
        schema:
          format: date-time
          type: string
        style: form
        x-nullable: true
      - description: End date to which point to fetch logs.
        explode: true
        in: query
        name: endAt
        required: false
        schema:
          format: date-time
          type: string
        style: form
        x-nullable: true
      - description: "Expression to filter the result set. Read more about [filtering\
          \ results from LUSID](https://support.lusid.com/filtering-results-from-lusid)."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          maxLength: 3000
          minLength: 0
          pattern: "^[\\s\\S]*$"
          type: string
        style: form
      - description: "Order the results by these fields. Use the '-' sign to denote\
          \ descending order e.g. -MyFieldName. Multiple fields can be denoted by\
          \ a comma e.g. -MyFieldName,AnotherFieldName,-AFurtherFieldName"
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          maxLength: 16384
          minLength: 1
          pattern: "^[\\s\\S]*$"
          type: string
        style: form
      - description: "When paginating, only return this number of records. The minimum\
          \ value is 0 and the maximum is 10000."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          maximum: 10000
          minimum: 1
          type: integer
        style: form
        x-nullable: true
      - description: "Encoded page string returned from a previous search result that\
          \ will retrieve the next page of data. When this field is supplied, filter\
          \ and sortby fields should not be supplied."
        explode: true
        in: query
        name: page
        required: false
        schema:
          maxLength: 4500
          minLength: 1
          pattern: "^[a-zA-Z0-9\\+/]*={0,3}$"
          type: string
        style: form
      - description: The interval for an included histogram of the logs
        explode: true
        in: query
        name: histogramInterval
        required: false
        schema:
          format: date-span
          type: string
        style: form
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResourceListWithHistogramOfAccessEvaluationLog'
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListWithHistogramOfAccessEvaluationLog'
            text/json:
              schema:
                $ref: '#/components/schemas/ResourceListWithHistogramOfAccessEvaluationLog'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
          description: The details of the input related failure
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidProblemDetails'
          description: Error response
      security:
      - oauth2: []
      summary: "[EARLY ACCESS] ListAccessEvaluationLogs: List the logs for access\
        \ evaluations."
      tags:
      - Access Evaluations
      x-fbn-apistatus: EarlyAccess
      x-accepts: application/json
  /api/access/{id}:
    get:
      operationId: GetAccessEvaluationLog
      parameters:
      - description: The identifier of the access evaluation to obtain the log for.
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 200
          minLength: 1
          pattern: "^[a-zA-Z0-9\\-_:\\+]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccessEvaluationLog'
            application/json:
              schema:
                $ref: '#/components/schemas/AccessEvaluationLog'
            text/json:
              schema:
                $ref: '#/components/schemas/AccessEvaluationLog'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
          description: The details of the input related failure
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidProblemDetails'
          description: Error response
      security:
      - oauth2: []
      summary: |-
        [EARLY ACCESS] GetAccessEvaluationLog: Get the log for a specific access evaluation.
        This endpoint will be deprecated in the near future.
      tags:
      - Access Evaluations
      x-fbn-apistatus: EarlyAccess
      x-accepts: application/json
  /api/auditing/entries:
    get:
      description: "This will never be `null`, though it may be empty."
      operationId: ListEntries
      parameters:
      - description: The filter to be applied to the results.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: The order to return the entries in.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 1000
          format: int32
          type: integer
        style: form
        x-nullable: true
      - description: "The scrolling state, used to iterate through the data set."
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollableCollectionOfAuditEntry'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
          description: The details of the input related failure
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidProblemDetails'
          description: Error response
      security:
      - oauth2: []
      summary: "[EARLY ACCESS] ListEntries: Get the audit entries."
      tags:
      - Auditing
      x-fbn-apistatus: EarlyAccess
      x-accepts: application/json
    post:
      operationId: CreateEntry
      requestBody:
        content:
          application/json:
            example:
              process:
                name: processName
                runId: processRunId
                startTime: 0001-01-01T00:00:00.0000000+00:00
              data:
                action: dataAction
                category: dataCategory
                userId: dataUserId
                message: dataMessage
                resource:
                  type: resourceType
                  identifier: resourceIdentifier
                detailsType: dataDetailsType
            schema:
              $ref: '#/components/schemas/CreateAuditEntry'
          application/json-patch+json:
            example:
              process:
                name: processName
                runId: processRunId
                startTime: 0001-01-01T00:00:00.0000000+00:00
              data:
                action: dataAction
                category: dataCategory
                userId: dataUserId
                message: dataMessage
                resource:
                  type: resourceType
                  identifier: resourceIdentifier
                detailsType: dataDetailsType
            schema:
              $ref: '#/components/schemas/CreateAuditEntry'
        description: Information about the entry to be created.
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
          description: Created
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: "There have been too many recent requests, retry later (using\
            \ the RETRY-AFTER header value as the delay)."
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidValidationProblemDetails'
          description: The details of the input related failure
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LusidProblemDetails'
          description: Error response
      security:
      - oauth2: []
      summary: "[EARLY ACCESS] CreateEntry: Create (persist) and audit entry.."
      tags:
      - Auditing
      x-fbn-apistatus: EarlyAccess
      x-content-type: application/json
      x-accepts: application/json
  /api/auditing/processes:
